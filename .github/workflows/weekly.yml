name: Weekly report

on:
  schedule:
    - cron: "0 12 * * 2"   # Tuesday 8am ET: last week's recap, right after Monday night
    - cron: "0 18 * * 4"   # Thursday 2pm ET: refreshed odds before the first game
    - cron: "0 14 * * 0"   # Sunday 10am ET: final odds with Sunday lineups
  workflow_dispatch:
    inputs:
      week:
        description: "Week to build (leave blank for the latest)"
        required: false
  push:
    branches: [main]
    paths: ["notes/**", "template.html", "generate.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build report
        env:
          WEEK: ${{ github.event.inputs.week }}
        run: python generate.py
      - name: Commit if changed
        run: |
          git config user.name "beekeeprs-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Report update"
          git push

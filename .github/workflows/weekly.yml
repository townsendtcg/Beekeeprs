name: Weekly report

on:
  schedule:
    - cron: "0 14 * * 3"   # Wednesdays 14:00 UTC (10am ET)
  workflow_dispatch:
    inputs:
      week:
        description: "Preview week to build (leave blank to auto-detect)"
        required: false
  push:
    branches: [main]
    paths: ["notes/**", "template.html", "generate.py"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build report
        env:
          WEEK: ${{ github.event.inputs.week }}
        run: python generate.py
      - name: Commit if changed
        run: |
          git config user.name "beekeeprs-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Weekly report update"
          git push
